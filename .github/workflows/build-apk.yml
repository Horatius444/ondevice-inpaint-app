name: Build Inpainting APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: pwsh
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Download ONNX Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest `
            -Uri "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.18.0/onnxruntime-android-1.18.0.aar" `
            -OutFile "onnxruntime.zip"

          Expand-Archive -Path "onnxruntime.zip" -DestinationPath "ort-aar"

      - name: Build APK
        shell: pwsh
        run: |
          $env:ANDROID_SDK_ROOT = $env:ANDROID_HOME
          $env:ORT_EXTRACT = "$env:GITHUB_WORKSPACE\ort-aar"
          python build_manual.py

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: inpainting-apk
          path: build_manual/app-debug.apk
